# Diplomacy Lab virtual host.
#
# This is the outer layer of the Lab's access control. How it guards the site depends on where the
# Lab is running, so the rule itself lives in /etc/apache2/lab-access.conf, which the entrypoint
# writes on startup:
#
#   * On your own Mac, the Lab is published only on 127.0.0.1, so nothing outside the machine can
#     reach it at all and the rule is "allow". There is no password to type.
#   * On a hosted server it is reachable from the internet, so the rule demands the owner's
#     credentials and no page, asset or API route can be called anonymously.
#
# lib/labMode.php is the inner layer and checks the same thing again from inside the application.

ServerName diplomacy-lab
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
	DocumentRoot /var/www/html

	# Railway terminates TLS at the edge, so the browser is on HTTPS even though this server is not.
	# Trust its scheme header so cookies and redirects stay on HTTPS.
	SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

	<Directory /var/www/html>
		Options -Indexes -ExecCGI -Includes +FollowSymLinks
		AllowOverride None

		# Written by docker/entrypoint.sh: either "Require all granted" for a Lab that is only
		# reachable from your own machine, or an HTTP authentication challenge for a hosted one.
		Include /etc/apache2/lab-access.conf
	</Directory>

	# The health check has to answer before anyone has signed in, so the platform can tell whether
	# the container came up. health.php deliberately reports nothing but a status.
	<Files "health.php">
		Require all granted
	</Files>

	# Nothing below is part of Diplomacy Lab, and none of it should ever be served.
	<FilesMatch "^(config\.php|config\.sample\.php|adminInfo.*\.php|composer\.(json|lock)|Dockerfile|\.dockerignore|.*\.sql|.*\.sh|.*\.md)$">
		Require all denied
	</FilesMatch>

	<DirectoryMatch "^/var/www/html/(\.git|install|docker|doc|sse-server|beta-src|errorlog|orderlog|gamebackups)">
		Require all denied
	</DirectoryMatch>

	# contrib/ holds two very different things: PHP the Lab never uses (the payment handler, the
	# mailer, the phpBB integration) and the vendored front-end libraries the board is built on -
	# Prototype and Scriptaculous, which every page loads, plus the unit images. Denying the whole
	# folder breaks the board, so the PHP is denied and the assets are served.
	<DirectoryMatch "^/var/www/html/contrib">
		<FilesMatch "\.(php|txt|ttf)$">
			Require all denied
		</FilesMatch>
	</DirectoryMatch>

	<DirectoryMatch "^/var/www/html/contrib/(PHPMailer_v5\.1|phpBB3-files)">
		Require all denied
	</DirectoryMatch>

	# webDiplomacy has two files it loads with a <script> tag despite their .json name: the board's
	# turn data under mapstore/, and the list of online users. Both hold JavaScript, so they are
	# served as JavaScript - otherwise the nosniff header below quite correctly refuses to run them
	# and the classic board comes up with no units on it.
	<DirectoryMatch "^/var/www/html/(mapstore|cache/stats)">
		<FilesMatch "\.json$">
			ForceType text/javascript
		</FilesMatch>
	</DirectoryMatch>

	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "same-origin"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Strict-Transport-Security "max-age=15552000"
	# The Lab embeds webDiplomacy's own board in a frame on the same origin.
	Header always set Content-Security-Policy "frame-ancestors 'self'"

	# Errors go to the container log, never to the browser.
	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
	LogLevel warn
</VirtualHost>
